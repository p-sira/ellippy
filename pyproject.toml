[project]
name = "ellippy"
description = "An elliptic integral library for Python"
authors = [{ name = "Sira Pornsiriprasert", email = "code@psira.me" }]
maintainers = [{ name = "Sira Pornsiriprasert", email = "code@psira.me" }]

readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dynamic = ["version"]

dependencies = [
  "numpy>=2.2.6",
]

[project.urls]
Documentation = "https://p-sira.github.io/ellippy/"
Homepage = "https://github.com/p-sira/ellippy"
Issues = "https://github.com/p-sira/ellippy/issues"
Repository = "https://github.com/p-sira/ellippy"

[dependency-groups]
dev = [
  "maturin>=1.11.5",
  "myst-parser>=4.0.1",
  "pydata-sphinx-theme>=0.16.1",
  "pytest>=8.4.2",
  "sphinx>=8.1.3",
  "sphinx-autodoc-typehints>=3.0.1",
  "sphinxcontrib-napoleon>=0.7",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "ellippy.ellippy_binding"
python-source = "python"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
