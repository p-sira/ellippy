name: Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.python-version }}-
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Build package
        run: uv run maturin develop --release --locked

      - name: Run pytest
        run: uv run pytest -v

  calibration:
    name: Calibration policy verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --dev
      - run: uv run maturin develop --release --locked --features threshold-calibration
      - run: uv run pytest python/tests/test_calibration.py -q
        env:
          RAYON_NUM_THREADS: "2"
      - run: uv run maturin develop --release --locked
      - name: Verify production build has no calibration hooks
        run: uv run python -c 'from ellippy import ellippy_binding as b; assert not hasattr(b, "_set_threshold_calibration"); assert not hasattr(b, "_threshold_calibration_state")'
