[package]
name = "ellippy_binding"
version = "1.2.0"
edition = "2024"
description = "Rust-to-Python binding for EllipPy"

homepage = "https://github.com/p-sira/ellippy"
repository = "https://github.com/p-sira/ellippy"
readme = "README.md"
license = "BSD-3-Clause"

include = ["/src", "/LICENSE"]

[lib]
name = "ellippy_binding"
crate-type = ["cdylib"]

[dependencies]
ellip = "1.2.0"
ellip-rayon = "1.2.0"
numpy = "0.26.0"
pyo3 = { version = "0.26.0", features = ["extension-module"] }
rayon = "1.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
